<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>小红书选品工作台</title>
  <style>
    :root {
      --red: #FF2442;
      --red-hover: #F20D32;
      --red-soft: #FFF1F3;
      --red-border: #FFD6DC;
      --ink: #1F2329;
      --ink2: #4E5969;
      --ink3: #8F959E;
      --line: #E5E6EB;
      --line-card: #EAECEF;
      --canvas: #F5F6F8;
      --surface: #FFFFFF;
      --green: #10B981;
      --green-soft: #EFF9F4;
      --blue: #1890FF;
      --blue-soft: #E8F4FF;
      --purple: #722ED1;
      --purple-soft: #F5EEFF;
      --amber: #F59E0B;
      --danger: #E5484D;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--canvas);
      font-family: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", "Segoe UI", system-ui, sans-serif;
      color: var(--ink);
      font-size: 13px;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select, textarea { font: inherit; }
    body { display: flex; flex-direction: column; }
    main {
      min-height: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 14px 18px 18px;
      gap: 12px;
      overflow: hidden;
    }

    /* Page Header */
    .head { display: flex; flex-direction: column; gap: 12px; }
    .page-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .page-title-left h1 {
      font-size: 20px;
      font-weight: 600;
      line-height: 1.25;
      margin: 0;
      color: var(--ink);
    }
    .page-title-left .subtitle {
      font-size: 12px;
      color: var(--ink3);
      margin-top: 4px;
    }
    .page-title-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-page-primary {
      height: 32px;
      padding: 0 14px;
      background: var(--red);
      color: #fff;
      border: 0;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-page-primary:hover { background: var(--red-hover); }
    .badge-collecting {
      height: 24px;
      padding: 0 10px;
      border-radius: 999px;
      background: var(--red-soft);
      border: 1px solid var(--red-border);
      color: var(--red);
      font-size: 11px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .badge-collecting-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--red);
    }

    /* KPI Cards */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    .metric-card {
      background: #fff;
      border: 1px solid var(--line-card);
      border-radius: 8px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.02);
    }
    .metric-card.clickable-card {
      cursor: pointer;
      user-select: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .metric-card.clickable-card:hover {
      border-color: #BDBDBD;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
    .metric-icon-box {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      flex: none;
      font-size: 18px;
    }
    .icon-box-red { background: #FFF1F3; color: var(--red); }
    .icon-box-blue { background: #F0F5FF; color: var(--blue); }
    .metric-content { flex: 1; min-width: 0; }
    .metric-content .label { font-size: 12px; color: var(--ink3); line-height: 1.2; }
    .metric-content .val {
      font-size: 22px;
      font-weight: 600;
      line-height: 1.2;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
      margin-top: 3px;
    }
    .metric-content .delta {
      font-size: 11px;
      color: var(--red);
      margin-top: 2px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 2px;
    }

    /* Table Card */
    .table-card {
      background: #fff;
      border: 1px solid var(--line-card);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 1px 2px rgba(0,0,0,0.02);
      flex: 1;
      min-height: 0;
    }
    .toolbar {
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 8px;
      background: #fff;
    }
    .searchbox {
      width: 280px;
      height: 32px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      background: #fff;
      color: var(--ink3);
    }
    .searchbox input {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      font-size: 12px;
    }
    .searchbox input::placeholder { color: var(--ink3); }
    .selectbox {
      height: 32px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink2);
      padding: 0 10px;
      font-size: 12px;
      outline: 0;
      cursor: pointer;
    }
    .selectbox:hover { border-color: #BDBDBD; }
    .grow { flex: 1; }
    .btn-tool {
      height: 32px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink2);
      font-size: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .btn-tool:hover { background: #FAFAFA; border-color: #BDBDBD; }
    .btn-tool:disabled { opacity: .45; cursor: not-allowed; }
    .btn-tool.danger { color: var(--danger); }
    .toolbar-menu { position: relative; display: inline-flex; }
    .toolbar-menu-list {
      position: absolute;
      top: 36px;
      right: 0;
      z-index: 20;
      min-width: 132px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      box-shadow: 0 8px 24px rgba(15, 23, 42, .12);
    }
    .toolbar-menu-list[hidden] { display: none; }
    .toolbar-menu-list button {
      width: 100%;
      height: 32px;
      padding: 0 10px;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: var(--ink2);
      font-size: 12px;
      text-align: left;
      cursor: pointer;
    }
    .toolbar-menu-list button:hover { background: #F7F8FA; }
    .toolbar-menu-list button:disabled { color: var(--ink3); cursor: not-allowed; }

    .notice {
      margin: 0 14px 10px;
      padding: 8px 12px;
      background: var(--canvas);
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--ink2);
      font-size: 12px;
    }
    .notice.success { background: #F2FAF6; border-color: #D8EEE3; color: var(--green); }
    .notice.error { background: #FFF3F4; border-color: #F7CDD1; color: var(--danger); }
    .notice[hidden] { display: none; }

    #content {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .tablewrap {
      flex: 1;
      min-height: 0;
      overflow-x: auto;
      overflow-y: auto;
      background: #fff;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      min-width: 1120px;
    }
    th {
      height: 38px;
      text-align: left;
      color: var(--ink3);
      font-size: 12px;
      font-weight: 500;
      border-bottom: 1px solid var(--line);
      padding: 0 10px;
      background: #FAFAFA;
      white-space: nowrap;
    }
    td {
      height: 56px;
      border-bottom: 1px solid var(--line);
      font-size: 12px;
      padding: 0 10px;
      vertical-align: middle;
      color: var(--ink);
    }
    .product-data-table th,
    .product-data-table td,
    .shop-products-table th,
    .shop-products-table td { text-align: center; }
    .product-data-table th:nth-child(2),
    .product-data-table td:nth-child(2),
    .product-data-table th:nth-child(3),
    .product-data-table td:nth-child(3),
    .shop-products-table th:first-child,
    .shop-products-table td:first-child { text-align: left; }
    tr.product-row { cursor: pointer; transition: background-color 0.12s ease; }
    tr.product-row:hover:not(.selected-row) { background: #FAFBFD; }
    tr.product-row.selected-row { background: #F4F8FF; }

    .product { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .product img {
      width: 44px;
      height: 44px;
      object-fit: cover;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #F7F7F7;
      flex: none;
    }
    .copy { min-width: 0; flex: 1; }
    .product-title-link {
      display: block;
      color: var(--ink);
      font-size: 12px;
      font-weight: 500;
      line-height: 1.35;
      text-decoration: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .product-title-link:hover { color: var(--red); }
    .shop-cell { display: flex; flex-direction: column; gap: 2px; }
    .shop-name { font-weight: 500; color: var(--ink); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .shop-sub { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--ink3); white-space: nowrap; }
    .star-rating { color: var(--amber); font-weight: 600; }

    .num { font-variant-numeric: tabular-nums; font-weight: 500; }
    .num.highlight { color: var(--red); font-weight: 600; }
    .metric-value, .metric-hint { display: block; }
    .metric-value.positive { color: var(--red); font-weight: 600; }
    .metric-hint {
      font-size: 11px;
      line-height: 1.3;
      font-weight: 400;
      color: var(--ink3);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    .status {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 11px;
      line-height: 1.2;
      white-space: nowrap;
    }
    .status.active, .status.success { background: #EFF9F4; color: var(--green); }
    .status.paused, .status.muted { background: #F2F3F5; color: var(--ink3); }
    .status.warning { background: #FFF7E8; color: var(--amber); }
    .status.danger { background: #FFF0F1; color: var(--danger); }

    .selected {
      display: inline-flex;
      margin-top: 2px;
      border-radius: 4px;
      padding: 1px 5px;
      background: #FFF1F3;
      color: var(--red);
      font-size: 10px;
      font-style: normal;
      font-weight: 500;
    }

    .actions { display: flex; align-items: center; justify-content: center; }
    .more-btn {
      width: 28px;
      height: 28px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: #fff;
      color: var(--ink2);
      cursor: pointer;
      font-size: 15px;
      line-height: 20px;
      flex: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .more-btn:hover { background: #F5F7FA; border-color: #BDBDBD; color: var(--red); }

    /* Pager */
    .pager {
      height: 48px;
      flex: none;
      padding: 0 16px;
      border-top: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--ink3);
      font-size: 12px;
      background: #fff;
    }
    .pager-left { color: var(--ink3); font-size: 12px; }
    .pager-right { display: flex; align-items: center; gap: 6px; }
    .page-btn {
      width: 28px;
      height: 28px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: #fff;
      color: var(--ink2);
      cursor: pointer;
      display: grid;
      place-items: center;
      font-size: 12px;
      padding: 0;
    }
    .page-btn.active {
      background: var(--red);
      border-color: var(--red);
      color: #fff;
      font-weight: 600;
    }
    .page-btn:hover:not(.active):not(:disabled) { border-color: #BDBDBD; background: #FAFAFA; }
    .page-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .pager-ellipsis { width: 18px; text-align: center; color: var(--ink3); font-size: 12px; }
    .pager-goto {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      color: var(--ink2);
      margin-left: 8px;
    }
    .pager-goto-input {
      width: 32px;
      height: 28px;
      border: 1px solid var(--line);
      border-radius: 4px;
      text-align: center;
      font-size: 12px;
      color: var(--ink);
      padding: 0;
      outline: none;
    }
    .pager-goto-input:focus { border-color: var(--blue); }

    /* Product detail and trend panel */
    .dock-card {
      background: #fff;
      border: 1px solid var(--line-card);
      border-radius: 8px;
      padding: 18px 22px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0;
      box-shadow: 0 1px 2px rgba(0,0,0,0.02);
      flex: none;
    }
    .dock-detail {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-width: 0;
      padding-right: 28px;
    }
    .dock-title-line {
      font-size: 14px;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 14px;
    }
    .dock-detail-body {
      display: flex;
      align-items: flex-start;
      gap: 16px;
    }
    .dock-thumb {
      width: 128px;
      height: 128px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid var(--line);
      background: #F7F7F7;
      flex: none;
    }
    .dock-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-self: stretch;
    }
    .dock-product-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--ink);
      line-height: 1.5;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .dock-shop-row {
      font-size: 12px;
      color: var(--ink3);
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
    }
    .dock-metrics-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0;
      margin-top: 18px;
    }
    .dock-metric-box { min-width: 0; padding: 0 10px; border-left: 1px solid var(--line); }
    .dock-metric-box:first-child { padding-left: 0; border-left: 0; }
    .dock-metric-box small { display: block; font-size: 12px; color: var(--ink3); margin-bottom: 6px; white-space: nowrap; }
    .dock-metric-box b {
      display: block;
      font-size: 20px;
      font-weight: 600;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }
    .dock-metric-box b.red { color: var(--red); }
    .dock-links-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 16px;
    }
    .dock-link-btn {
      height: 32px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: #fff;
      color: var(--ink2);
      font-size: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      text-decoration: none;
    }
    .dock-link-btn:hover {
      background: #F7F8FA;
      border-color: #C9CDD4;
    }

    /* Trend Section */
    .dock-trend {
      display: flex;
      flex-direction: column;
      min-width: 0;
      padding-left: 28px;
      border-left: 1px solid var(--line);
    }
    .trend-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px 16px;
      margin-bottom: 12px;
    }
    .trend-head-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .trend-head-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: flex-end;
      gap: 6px;
      margin-left: auto;
    }
    .trend-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--ink);
    }
    .trend-mode-switch {
      display: inline-flex;
      gap: 6px;
    }
    .trend-mode-btn {
      height: 26px;
      padding: 0 12px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 4px;
      font-size: 12px;
      color: var(--ink2);
      cursor: pointer;
    }
    .trend-mode-btn.active {
      border-color: var(--red);
      color: var(--red);
      background: #fff;
      font-weight: 500;
    }
    .trend-range-switch {
      display: inline-flex;
      align-items: center;
    }
    .trend-range-btn {
      height: 28px;
      min-width: 54px;
      padding: 0 10px;
      background: #fff;
      border: 1px solid var(--line);
      border-left: 0;
      color: var(--ink2);
      font-size: 12px;
      cursor: pointer;
    }
    .trend-range-btn:first-child { border-left: 1px solid var(--line); border-radius: 4px 0 0 4px; }
    .trend-range-btn:last-child { border-radius: 0 4px 4px 0; }
    .trend-range-btn.active { border-color: var(--red); color: var(--red); position: relative; z-index: 1; }
    .trend-svg-container {
      flex: none;
      height: 150px;
      width: 100%;
      position: relative;
      background: #fff;
    }
    .trend-svg-container svg { width: 100%; height: 100%; display: block; }
    .trend-grid { stroke: #EEE; stroke-width: 1; }
    .trend-axis { fill: #777; font-size: 10px; }
    .trend-area { fill: rgba(255,36,66,0.08); }
    .trend-line { fill: none; stroke: var(--red); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .trend-point { fill: #fff; stroke: var(--red); stroke-width: 2; cursor: pointer; }
    .trend-bar { fill: var(--red); opacity: 0.8; cursor: pointer; }
    .trend-bar:hover { opacity: 1; }
    .trend-bar-gap { stroke-width: 1.5; stroke-dasharray: 4 3; opacity: 1; }
    .trend-bar-gap-missing { fill: #E8E8E8; stroke: #777; }
    .trend-bar-gap-anomaly { fill: #FFF3DA; stroke: #C87500; }
    .trend-bar-gap-mixed { fill: #F3E8D4; stroke: #9A6A32; }
    .trend-empty { color: var(--ink3); font-size: 12px; }
    .trend-note { margin-top: 6px; color: var(--ink3); font-size: 11px; line-height: 1.4; }
    .trend-summary-text { font-size: 11px; color: var(--ink2); font-weight: 500; }

    /* Modals & Overlays */
    .action-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.30);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 1000;
    }
    .action-overlay[hidden] { display: none; }
    .action-panel, .import-panel, .export-panel, .settings-panel, .trend-panel {
      width: min(460px, calc(100vw - 48px));
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: 0 8px 28px rgba(0,0,0,.12);
      padding: 18px;
    }
    .import-panel { width: min(560px, calc(100vw - 48px)); }
    .action-panel-head { display: flex; align-items: flex-start; gap: 12px; }
    .action-panel-copy { min-width: 0; flex: 1; }
    .action-panel-copy h2 { margin: 0; font-size: 16px; font-weight: 600; color: var(--ink); }
    .action-panel-copy p { margin: 4px 0 0; color: var(--ink3); font-size: 12px; }
    .action-close {
      width: 26px;
      height: 26px;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: var(--ink3);
      cursor: pointer;
      font-size: 18px;
    }
    .action-close:hover { background: #F5F5F5; }
    .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
    .action-tile {
      min-height: 68px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      text-align: left;
      padding: 10px 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .action-tile:hover:not(:disabled) { border-color: #BDBDBD; background: #FAFAFA; }
    .action-tile:disabled { opacity: .45; cursor: not-allowed; }
    .action-tile[hidden] { display: none; }
    .action-icon { width: 30px; height: 30px; border-radius: 6px; background: #F5F5F5; display: grid; place-items: center; font-size: 14px; flex: none; }
    .action-tile.primary .action-icon { background: var(--red-soft); color: var(--red); }
    .action-tile.danger .action-icon { background: #FFF2F2; color: var(--danger); }
    .action-tile strong { display: block; font-size: 12px; font-weight: 500; color: var(--ink); }
    .action-tile small { display: block; font-size: 11px; color: var(--ink3); margin-top: 2px; }

    .import-text {
      width: 100%;
      height: 140px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px 12px;
      outline: 0;
      font-size: 12px;
    }
    .import-hint { margin-top: 6px; color: var(--ink3); font-size: 11px; }
    .settings-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
    .btn {
      height: 30px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      cursor: pointer;
      font-size: 12px;
    }
    .btn.primary { background: var(--red); border-color: var(--red); color: #fff; font-weight: 500; }
    .btn.primary:hover:not(:disabled) { background: var(--red-hover); }

    .export-summary { margin-top: 12px; padding: 10px 12px; border-radius: 6px; background: var(--canvas); color: var(--ink2); font-size: 12px; }
    .export-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
    .export-format { min-height: 54px; border: 1px solid var(--line); border-radius: 6px; background: #fff; cursor: pointer; text-align: left; padding: 8px 12px; }
    .export-format:hover { background: #FAFAFA; border-color: #BDBDBD; }
    .export-format strong { display: block; font-size: 12px; font-weight: 500; }
    .export-format small { display: block; font-size: 11px; color: var(--ink3); margin-top: 3px; }

    .settings-form { margin-top: 12px; display: grid; gap: 10px; }
    .settings-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 8px 0; border-bottom: 1px solid var(--line); }
    .settings-row:last-of-type { border-bottom: 0; }
    .settings-copy strong { display: block; font-size: 12px; font-weight: 500; }
    .settings-copy small { display: block; font-size: 11px; color: var(--ink3); margin-top: 2px; }
    .settings-number { width: 100px; height: 30px; border: 1px solid var(--line); border-radius: 6px; padding: 0 8px; text-align: right; }
    .settings-runtime { margin-top: 10px; padding: 8px 10px; border-radius: 6px; background: var(--canvas); color: var(--ink3); font-size: 11px; }

    /* Shops view cards */
    .shoplist { padding: 0; display: flex; flex: 1; min-height: 0; flex-direction: column; gap: 8px; overflow: auto; }
    .shopcard { border: 1px solid var(--line-card); border-radius: 8px; background: #fff; overflow: hidden; }
    .shoprow { padding: 12px 14px; display: grid; grid-template-columns: 2fr 1fr 1.2fr 1.2fr 1.2fr 1fr 80px; gap: 10px; align-items: center; cursor: pointer; }
    .shoprow > * { text-align: center; }
    .shoprow:hover { background: #FAFBFD; }
    .shopid { display: flex; gap: 10px; align-items: center; text-align: left; }
    .shopid > div:last-child { min-width: 0; }
    .shopid b, .shop-meta-line { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .shop-meta-line { margin-top: 3px; color: var(--ink3); font-size: 11px; }
    .shoplogo { position: relative; overflow: hidden; width: 36px; height: 36px; border-radius: 50%; background: var(--red-soft); color: var(--red); display: grid; place-items: center; font-weight: 600; flex: none; }
    .shoplogo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .shopmetric span { display: block; color: var(--ink3); font-size: 11px; }
    .shopmetric b { display: block; font-size: 14px; font-weight: 600; margin-top: 2px; }
    .shopmetric b.positive { color: var(--red); }
    .shop-expand { border-top: 1px solid var(--line); background: #FCFCFC; padding: 0 14px 10px; overflow: auto; }
  </style>
</head>
<body>
  <main>
    <section class="head" id="pageHead"></section>
    <div class="table-card">
      <div class="toolbar" id="toolbar"></div>
      <div class="notice" id="notice" hidden></div>
      <div id="content"><div class="empty" style="padding:60px 0;text-align:center;color:var(--ink3);">正在加载…</div></div>
    </div>
    <div class="dock-card" id="dockCard" hidden></div>
  </main>


  <div class="action-overlay" id="actionOverlay" hidden>
    <section class="action-panel" role="dialog" aria-modal="true" aria-labelledby="actionTitle">
      <div class="action-panel-head">
        <div class="action-panel-copy"><h2 id="actionTitle">商品操作</h2><p id="actionProductTitle">—</p></div>
        <button class="action-close" id="actionClose" type="button" aria-label="关闭">×</button>
      </div>
      <div class="action-grid">
        <button class="action-tile primary" id="actionCollect" type="button" data-modal-action="collect">
          <span class="action-icon">↻</span><span><strong>立即采集</strong><small>立即获取一次最新商品数据</small></span>
        </button>
        <button class="action-tile" id="actionPause" type="button" data-modal-action="pause">
          <span class="action-icon">Ⅱ</span><span><strong>暂停监控</strong><small>停止后续采集，可随时恢复</small></span>
        </button>
        <button class="action-tile" id="actionSelection" type="button" data-modal-action="selection">
          <span class="action-icon">☆</span><span><strong>加入选品中心</strong><small>保留监控，同时加入选品中心</small></span>
        </button>
        <button class="action-tile" id="actionShop" type="button" data-modal-action="shop">
          <span class="action-icon">店</span><span><strong>加入店铺监控</strong><small>按商品所属店铺自动归类</small></span>
        </button>
        <button class="action-tile danger" id="actionRemove" type="button" data-modal-action="remove">
          <span class="action-icon">−</span><span><strong>移出监控</strong><small>仅移出单品列表，历史采集数据保留</small></span>
        </button>
      </div>
    </section>
  </div>

  <div class="action-overlay" id="shopImportOverlay" hidden>
    <section class="import-panel" role="dialog" aria-modal="true" aria-labelledby="shopImportTitle">
      <div class="action-panel-head">
        <div class="action-panel-copy"><h2 id="shopImportTitle">添加商品</h2><p>粘贴商品分享链接，或直接粘贴包含链接的小红书分享口令/分享文本。</p></div>
        <button class="action-close" id="shopImportClose" type="button" aria-label="关闭">×</button>
      </div>
      <div style="margin-top:16px">
        <textarea class="import-text" id="shopImportText" placeholder="例如：复制小红书商品分享文本到这里，可一次粘贴多个商品。"></textarea>
        <div class="import-hint" id="shopImportHint">系统会在后台采集商品信息并加入当前监控范围。</div>
        <div class="settings-actions">
          <button class="btn" id="shopImportCancel" type="button">取消</button>
          <button class="btn primary" id="shopImportSubmit" type="button">提交添加</button>
        </div>
      </div>
    </section>
  </div>

  <div class="action-overlay" id="exportOverlay" hidden>
    <section class="export-panel" role="dialog" aria-modal="true" aria-labelledby="exportTitle">
      <div class="action-panel-head">
        <div class="action-panel-copy"><h2 id="exportTitle">导出当前筛选结果</h2><p id="exportDescription">导出的不是当前页，而是当前搜索、筛选和排序条件下的全部结果。</p></div>
        <button class="action-close" id="exportClose" type="button" aria-label="关闭">×</button>
      </div>
      <div class="export-summary" id="exportSummary">正在统计可导出数据…</div>
      <label id="exportTypeRow" style="display:block;margin-top:12px;font-size:12px;color:var(--ink2);">导出内容
        <select class="selectbox" id="exportType" style="display:block;width:100%;margin-top:6px;">
          <option value="">商品汇总</option>
          <option value="24h">近24小时销量明细</option>
          <option value="7d">近7天销量明细</option>
          <option value="30d">近30天销量明细</option>
        </select>
      </label>
      <div class="export-actions">
        <button class="export-format" id="exportXlsx" type="button"><strong>Excel（.xlsx）</strong><small>适合继续筛选、排序和编辑</small></button>
        <button class="export-format" id="exportCsv" type="button"><strong>CSV（.csv）</strong><small>UTF-8 BOM，兼容中文 Excel</small></button>
      </div>
      <div class="settings-actions">
        <button class="btn" id="exportCancel" type="button">取消</button>
      </div>
    </section>
  </div>

  <div class="action-overlay" id="settingsOverlay" hidden>
    <section class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div class="action-panel-head">
        <div class="action-panel-copy"><h2 id="settingsTitle">全局采集设置</h2><p>所有持续监控商品共用同一采集频率。</p></div>
        <button class="action-close" id="settingsClose" type="button" aria-label="关闭">×</button>
      </div>
      <div class="settings-form">
        <label class="settings-row">
          <span class="settings-copy"><strong>自动采集</strong><small>开启后按全局间隔持续采集正常监控商品</small></span>
          <input class="settings-check" id="autoEnabledInput" type="checkbox">
        </label>
        <label class="settings-row">
          <span class="settings-copy"><strong>采集间隔</strong><small>5–1440 分钟；默认 60 分钟时 01:00–23:00 整点采集</small></span>
          <input class="settings-number" id="autoIntervalInput" type="number" min="5" max="1440" step="1">
        </label>
        <label class="settings-row">
          <span class="settings-copy"><strong>午夜基线采样</strong><small>200 个以内 23:55，超过 200 个 23:50；23:59 截止</small></span>
          <input class="settings-check" id="midnightEnabledInput" type="checkbox">
        </label>
        <div class="settings-runtime" id="settingsRuntime">正在读取运行状态…</div>
        <div class="settings-actions">
          <button class="btn" id="settingsCancel" type="button">取消</button>
          <button class="btn primary" id="settingsSave" type="button">保存设置</button>
        </div>
      </div>
    </section>
  </div>

  <div class="action-overlay" id="trendOverlay" hidden>
    <section class="trend-panel" role="dialog" aria-modal="true" aria-labelledby="trendTitle">
      <div class="action-panel-head">
        <div class="action-panel-copy"><h2 id="trendTitle">成交趋势</h2><p id="trendProductTitle">—</p></div>
        <button class="action-close" id="trendClose" type="button" aria-label="关闭">×</button>
      </div>
      <div class="trend-tabs" role="tablist" aria-label="趋势周期">
        <button class="trend-tab active" type="button" role="tab" aria-selected="true" data-trend-mode="daily">日销量</button>
        <button class="trend-tab" type="button" role="tab" aria-selected="false" data-trend-mode="hourly">小时销量</button>
      </div>
      <div class="trend-summary" id="trendSummary"></div>
      <div class="trend-chart" id="trendChart"></div>
      <div class="trend-note" id="trendNote"></div>
    </section>
  </div>
  <script src="/app.js?v=2.3.9"></script>
</body>
</html>
